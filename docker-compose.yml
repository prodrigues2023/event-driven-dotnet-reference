services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI: http://localhost:16686
      - "4317:4317"     # OTLP gRPC

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  ordering:
    build:
      context: .
      args: { PROJECT: Ordering }
    environment:
      DB_CONN: "Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=ordering"
      RABBIT_HOST: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  payments:
    build:
      context: .
      args: { PROJECT: Payments }
    environment:
      DB_CONN: "Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=payments"
      RABBIT_HOST: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  shipping:
    build:
      context: .
      args: { PROJECT: Shipping }
    environment:
      DB_CONN: "Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=shipping"
      RABBIT_HOST: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
